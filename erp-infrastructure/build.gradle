dependencies {
    // Dependencias de las capa de Infraestructura
    implementation project(':erp-common')
    implementation project(':erp-domain')
    implementation project(':erp-application')

    // Aquí irían dependencias como Spring Data JPA, controladores de BD, etc.

    // PostgreSQL
    implementation("org.postgresql:postgresql:42.7.13")

    // Spring Boot JPA
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")

    // MongoDB
    implementation("org.springframework.boot:spring-boot-starter-data-mongodb")

    // Redis
    implementation("org.springframework.boot:spring-boot-starter-data-redis")

    // Cache
    implementation("org.springframework.boot:spring-boot-starter-cache:4.1.0")
}